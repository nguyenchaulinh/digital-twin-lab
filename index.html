<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Twin Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font: 14px/1.5 system-ui, sans-serif; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #hud { position: fixed; top: 12px; left: 12px; width: 300px; padding: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; border-radius: 8px; }
      #hud h1 { margin: 0 0 8px; font-size: 15px; }
      #hud dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
      #hud dt { color: #94a3b8; }
      #hud dd { margin: 0; text-align: right; }
      #hint, #credits { margin-top: 8px; color: #94a3b8; font-size: 12px; }
      #credits a { color: inherit; }
      .alert { color: #f87171; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <h1>Digital Twin Lab</h1>
      <dl id="info"></dl>
      <div id="hint">Click a room to select it. Press A to toggle its AC.</div>
      <div id="credits">
        Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a> (CC BY 4.0).
        Air quality: <a href="https://aqicn.org/" target="_blank" rel="noopener noreferrer">World Air Quality Index Project</a>.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
